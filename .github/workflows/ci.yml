# Checks every pull request, and runs again as the first job of deploy.yml.
#
# - `verify` runs `pnpm verify`, the definition of done: format, lint, typecheck, tests, build,
#   and a deploy dry run.
# - `prune` runs `scripts/prune.ts` for each project variant, verifies the result, checks it
#   again after `--finish`, and looks for mentions of the half that the variant dropped, or of
#   OAuth after `bearer`, so a stale prune list fails here instead of in a new project. It runs
#   only in the template repository.
# - `workflows` lints the workflow files with actionlint.
#
# Needs no secrets or variables.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A pull request run is superseded by the next push to the same branch. Any other run, including
# the call from deploy.yml, gets a group of its own, so nothing cancels or evicts it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm installs before setup-node, because `cache: pnpm` asks pnpm where its store is. The
      # version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  prune:
    name: Prune to ${{ matrix.variants }}
    # A project created from the template is already pruned, so this job would fail there.
    if: github.repository == 'mckalexee/cloudflare-starter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Report every variant, not only the first one that fails.
      fail-fast: false
      matrix:
        # Each entry lists the variants to apply in order. An MCP-only project in bearer mode runs
        # `mcp-only` and then `bearer`.
        variants: [mcp-only, app-only, bearer, mcp-only bearer]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The script takes one variant per run.
      - name: Prune
        env:
          VARIANTS: ${{ matrix.variants }}
        run: |
          for variant in $VARIANTS; do
            node scripts/prune.ts "$variant"
          done

      # Pruning removes dependencies from package.json, so the lockfile has to change.
      - name: Reinstall the pruned dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Finish the setup
        run: node scripts/prune.ts --finish

      # `--finish` removes only marker lines and setup files, so the tests and the build don't need
      # to run again.
      - name: Check the finished project
        run: pnpm fmt:check && pnpm lint && pnpm typecheck

      # A variant that drops a half must leave no mention of that half's paths or packages, and
      # `bearer` must leave no mention of the OAuth sign-in. Bearer mode keeps the `OAUTH_KV`
      # binding name, so the pattern skips `OAUTH_`. A match means a file needs a marker or a swap
      # in `scripts/prune.ts`.
      - name: Check for leftovers of the dropped half
        env:
          VARIANTS: ${{ matrix.variants }}
        run: |
          for variant in $VARIANTS; do
            case "$variant" in
              mcp-only) pattern='(^|[^.])react|src/web|#web/' ;;
              app-only) pattern='mcp|oauth|src/auth|#auth/' ;;
              bearer)
                pattern='oauth([^_]|$)|consent|/callback|GITHUB_CLIENT|ALLOWED_GITHUB|COOKIE_SECRET'
                pattern+='|MCP_RESOURCE|auth/(provider|routes|authorize|upstream)'
                pattern+='|github (account|login|sign)|sign in with github'
                ;;
              *) continue ;;
            esac
            if grep -rniIE "$pattern" . \
              --exclude-dir={.git,node_modules,build,dist,.wrangler,.react-router} \
              --exclude={pnpm-lock.yaml,worker-configuration.d.ts}; then
              echo "::error::The $variant variant leaves the matches above behind."
              exit 1
            fi
          done

  workflows:
    name: Lint the workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The image bundles shellcheck and pyflakes, so `run` blocks are linted with no install
      # step. Renovate moves the version tag.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
