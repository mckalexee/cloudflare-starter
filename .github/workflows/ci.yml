# Checks every pull request, and runs again as the first job of deploy.yml.
#
# - `verify` runs `pnpm verify`, the definition of done: format, lint, typecheck, tests, build,
#   and a deploy dry run.
# - `prune` runs `scripts/prune.ts` for each project variant, verifies the result, checks it
#   again after `--finish`, and looks for mentions of what the variant dropped, so a stale prune
#   list fails here instead of in a new project. It runs only in the template repository.
# - `workflows` lints the workflow files with actionlint.
#
# Needs no secrets or variables.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A pull request run is superseded by the next push to the same branch. Any other run, including
# the call from deploy.yml, gets a group of its own, so nothing cancels or evicts it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm installs before setup-node, because `cache: pnpm` asks pnpm where its store is. The
      # version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

  prune:
    name: Prune with ${{ matrix.prune }}
    # A project created from the template is already pruned, so this job would fail there.
    if: github.repository == 'mckalexee/cloudflare-starter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Report every variant, not only the first one that fails.
      fail-fast: false
      matrix:
        # `prune` holds the script's arguments. Several runs, applied in order, are separated by
        # `;`, as an MCP-only project in bearer mode runs `mcp-only` and then `bearer`. `leftovers`
        # names what the result must not mention: a part (`web` or `mcp`), the Access identity
        # check (`access`), or the OAuth sign-in (`oauth`).
        include:
          - prune: mcp-only
            leftovers: web access
          - prune: app-only
            leftovers: mcp
          - prune: bearer
            leftovers: oauth
          - prune: mcp-only; bearer
            leftovers: web access oauth
          - prune: --parts mcp --sign-in access
            leftovers: web oauth
          - prune: --parts mcp,web --sign-in access
            leftovers: oauth
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prune
        env:
          PRUNE: ${{ matrix.prune }}
        run: |
          IFS=';' read -ra runs <<< "$PRUNE"
          for run in "${runs[@]}"; do
            read -ra args <<< "$run"
            node scripts/prune.ts "${args[@]}"
          done

      # Pruning removes dependencies from package.json, so the lockfile has to change.
      - name: Reinstall the pruned dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Finish the setup
        run: node scripts/prune.ts --finish

      # `--finish` removes only marker lines and setup files, so the tests and the build don't need
      # to run again.
      - name: Check the finished project
        run: pnpm fmt:check && pnpm lint && pnpm typecheck

      # A variant must leave no mention of the paths and packages of what it dropped. Without
      # OAuth, `OAUTH_KV` stays as a binding name, and Access sign-in's docs name Managed OAuth,
      # the `oauth_configuration` field, and the `oauth-protected-resource` paths, so the `oauth`
      # pattern skips exactly those. A match means a file needs a marker or a swap in
      # `scripts/prune.ts`.
      - name: Check for leftovers of what the variant dropped
        env:
          LEFTOVERS: ${{ matrix.leftovers }}
        run: |
          for leftover in $LEFTOVERS; do
            case "$leftover" in
              web) pattern='(^|[^.])react|src/web|#web/|WEB_ACCESS' ;;
              mcp) pattern='mcp|modelcontextprotocol|oauth|src/auth|#auth/' ;;
              access)
                pattern='src/http/access|#http/access|auth/access\.ts|helpers/access'
                pattern+='|ACCESS_TEAM_DOMAIN|ACCESS_AUD|access\.dev|cf-access-jwt'
                ;;
              oauth)
                pattern='(?<!managed )oauth(?!_kv|_configuration|-)|workers-oauth-provider'
                pattern+='|consent|/callback|GITHUB_CLIENT'
                pattern+='|ALLOWED_GITHUB|COOKIE_SECRET|MCP_RESOURCE'
                pattern+='|auth/(provider|routes|authorize|upstream)'
                pattern+='|github (account|login|sign)|sign in with github|signed-in (user|caller)'
                pattern+='|authorization code'
                ;;
              *)
                echo "::error::Unknown leftover kind $leftover."
                exit 1
                ;;
            esac
            # grep exits 1 when nothing matches, and 2 when it fails, such as on a bad pattern.
            status=0
            grep -rniIP "$pattern" . \
              --exclude-dir={.git,node_modules,build,dist,.wrangler,.react-router} \
              --exclude={pnpm-lock.yaml,worker-configuration.d.ts} || status=$?
            if [ "$status" = 0 ]; then
              echo "::error::The variant leaves the $leftover matches above behind."
              exit 1
            elif [ "$status" != 1 ]; then
              echo "::error::grep failed on the $leftover pattern."
              exit 1
            fi
          done

  workflows:
    name: Lint the workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The image bundles shellcheck and pyflakes, so `run` blocks are linted with no install
      # step. Renovate moves the version tag.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
